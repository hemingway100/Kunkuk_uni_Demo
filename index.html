<head>

    <script src="https://cdn.tailwindcss.com"></script>

      tailwind.config = {
        darkMode: 'class',

                50: '#f0fdf4',
                100: '#dcfce7',
                500: '#22c55e',
                600: '#16a34a',
                700: '#15803d',

          }

    </script>
    <style>
      body {
        font-family: 'Noto Sans KR', sans-serif;
